<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>สมัครสมาชิก</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="card">
<h2>สมัครสมาชิก</h2>
<form id="registerForm">
<input id="regUser" placeholder="ชื่อผู้ใช้" required>
<input type="email" id="regEmail" placeholder="อีเมล" required>
<input type="password" id="regPass" placeholder="รหัสผ่าน" required>

<select id="regRank" required>
<option value="">-- เลือกตำแหน่ง --</option>
<option value="นักศึกษา">นักศึกษา</option>
<option value="อาจารย์">อาจารย์</option>
<option value="เจ้าหน้าที่">เจ้าหน้าที่</option>
<option value="แอดมิน">แอดมิน</option>
</select>

<button type="submit" class="btn-primary">สมัครสมาชิก</button>
</form>
<a href="login.html" class="link">เข้าสู่ระบบ</a>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
